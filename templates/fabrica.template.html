<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fábrica de ofertas — Suite</title>
<style>
  body { margin:0; background:#020916; color:#f3f5fa; font:13.5px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1320px; margin:0 auto; padding:24px 22px 90px; }
  h1 { font-size:21px; font-weight:800; letter-spacing:-.4px; margin:0 0 3px; }
  h2, h3 { margin:0; }
  .sub { color:#90a2cd; font-size:12.5px; margin:0; max-width:700px; }
  .cabecera { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px 20px; margin:0 0 14px; }

  /* Botones y campos: 40 px de alto como minimo (lo que se toca con el dedo). border-box: un <a class="btn"> es content-box por omision. */
  .btn { box-sizing:border-box; max-width:100%; min-height:40px; padding:0 14px; border-radius:9px; border:1px solid #132751; background:#09152f; color:#d3daeb;
         font:650 13px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; text-align:center; }
  .btn:hover { border-color:#2f6bff; color:#fff; }
  .btn:disabled { opacity:.5; cursor:default; border-color:#132751; color:#d3daeb; }
  .btn.prim { background:linear-gradient(135deg,#2f6bff,#5b8cff); border-color:transparent; color:#fff; box-shadow:0 0 16px rgba(47,107,255,.4); }
  .btn.prim:disabled { box-shadow:none; }
  .btn.peligro { color:#ff8fb0; }
  .btn.ancho { width:100%; }
  input[type="text"], input[type="url"], input[type="number"], select, textarea { width:100%; box-sizing:border-box; min-height:40px; padding:8px 11px; border-radius:9px; border:1px solid #132751; background:#09152f; color:#f3f5fa; font:13px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; }
  textarea { resize:vertical; min-height:70px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#4d8bff; }
  input:disabled, select:disabled, textarea:disabled { opacity:.55; }
  input[type="color"] { width:46px; min-height:40px; padding:2px; border-radius:9px; border:1px solid #132751; background:#09152f; flex:0 0 46px; }
  label.campo { display:flex; flex-direction:column; gap:4px; font-size:11px; color:#90a2cd; font-weight:600; min-width:0; }
  .chk { display:flex; align-items:center; gap:9px; min-height:40px; font-size:12.5px; color:#d3daeb; cursor:pointer; }
  .chk input { width:22px; height:22px; margin:0; accent-color:#2f6bff; flex:0 0 22px; }

  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
  .tab { min-height:40px; padding:0 16px; border-radius:999px; border:1px solid #12254e; background:transparent; color:#bbc7e1; font:600 12.5px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; cursor:pointer; }
  .tab:hover { border-color:#2f6bff; color:#fff; }
  .tab.on { background:linear-gradient(135deg,#2f6bff,#5b8cff); border-color:transparent; color:#fff; box-shadow:0 0 14px rgba(47,107,255,.45); }

  .aviso { margin:0 0 12px; padding:10px 13px; border-radius:10px; font-size:12.5px; }
  .aviso:empty { display:none; }
  .aviso.mal { background:#2a1420; border:1px solid #5a2536; color:#ffc9d8; }
  .aviso.bien { background:#0d2a22; border:1px solid #14503f; color:#8ff0cd; }
  .aviso.ojo { background:#2a2110; border:1px solid #4a3a14; color:#ffd88a; }
  /* La revision de los flujos de venta encendidos (inicio y rama de pagos), 2026-11-06 */
  .rev { margin:0 0 12px; min-width:0; }
  .rev .aviso-of { margin:0; }
  .rev ul { margin:6px 0 4px; padding-left:18px; }
  .rev li { margin:8px 0; overflow-wrap:anywhere; }
  .rev .acciones { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .rev small { display:block; margin-top:6px; }
  .rev-linea { margin:0; font-size:12px; color:#8fa3c7; overflow-wrap:anywhere; }
  .rev-linea.bien { color:#38e0a5; }
  .rev-linea.ojo { color:#ffd88a; }
  .rev details { margin:4px 0 0; }
  .rev summary { cursor:pointer; padding:10px 0; text-decoration:underline; }

  /* Lista y ficha (mismo esquema que /radar). NO usa .card: esa sube 2 px al pasar el mouse y atrapa todo position:fixed. */
  .cuerpo { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:start; }
  .cuerpo.con-ficha { grid-template-columns:minmax(0,1fr) 560px; }
  .lista { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px; min-width:0; }
  .proy { background:#061026; border:1px solid #112247; border-radius:14px; padding:13px 14px 12px; min-width:0; cursor:pointer; display:flex; flex-direction:column; gap:9px; text-align:left; color:inherit; font:inherit;
          box-shadow:0 0 0 1px rgba(47,107,255,.04), 0 10px 30px rgba(0,0,0,.22); transition:border-color .15s ease, box-shadow .15s ease; }
  .proy:hover { border-color:#23408a; }
  .proy:focus-visible { outline:2px solid #4d8bff; outline-offset:2px; }
  .proy.sel { border-color:#2f6bff; box-shadow:0 0 0 1px #2f6bff, 0 0 26px rgba(47,107,255,.35); }
  .proy b.nom { display:block; font-size:14.5px; font-weight:750; letter-spacing:-.2px; overflow-wrap:anywhere; }
  .proy small { display:block; color:#7e93c5; font-size:11.5px; overflow-wrap:anywhere; }
  .lineas { display:flex; flex-wrap:wrap; gap:6px; }
  .lin { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; background:#0d1b39; color:#a7b6d8; white-space:nowrap; }
  .lin.lista { background:#0d2a22; color:#38e0a5; } .lin.en-curso { background:#241a4d; color:#c9b8ff; } .lin.error { background:#2a1420; color:#ff8fb0; } .lin.ojo { background:#2a2110; color:#ffc857; }
  .vacio { grid-column:1/-1; color:#90a2cd; padding:30px 6px; text-align:center; }

  .ficha { background:#061026; border:1px solid #112247; border-radius:14px; position:sticky; top:14px; max-height:calc(100vh - 28px); overflow:auto; min-width:0; box-shadow:0 0 0 1px rgba(47,107,255,.06), 0 18px 50px rgba(0,0,0,.4); }
  .ficha[hidden] { display:none; }
  .f-cab { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:11px; padding:12px 14px; background:rgba(6,16,38,.96); border-bottom:1px solid #112247; }
  .f-cab .t { flex:1; min-width:0; } .f-cab .t b { display:block; font-size:15px; overflow-wrap:anywhere; } .f-cab .t small { color:#7e93c5; font-size:11.5px; }
  .f-cab .cerrar { min-width:40px; padding:0; }
  .f-cuerpo { padding:14px 16px 24px; }

  /* Pasos unidos por una linea (oferta > ebooks > anuncios > flujos) */
  .paso { position:relative; padding:0 0 22px 38px; }
  .paso::before { content:''; position:absolute; left:13px; top:30px; bottom:0; width:2px; background:linear-gradient(#2f6bff,rgba(47,107,255,.15)); }
  .paso:last-child { padding-bottom:0; } .paso:last-child::before { display:none; }
  .paso > .n { position:absolute; left:0; top:0; width:28px; height:28px; border-radius:50%; background:#0d1b39; border:2px solid #2f6bff; color:#cfe0ff; display:grid; place-items:center; font-size:12px; font-weight:800; box-shadow:0 0 12px rgba(47,107,255,.35); }
  .paso.hecho > .n { background:#0d2a22; border-color:#34d399; color:#8ff0cd; box-shadow:0 0 12px rgba(52,211,153,.3); }
  .paso > h3 { font-size:13.5px; font-weight:750; line-height:28px; margin:0 0 7px; }
  .paso > h3 small { font-weight:500; color:#7e93c5; font-size:11.5px; margin-left:6px; }
  .kv { display:grid; grid-template-columns:104px minmax(0,1fr); gap:5px 10px; margin:0; font-size:12.5px; }
  .kv dt { color:#7e93c5; margin:0; } .kv dd { margin:0; color:#d3daeb; overflow-wrap:anywhere; min-width:0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; }
  .chip { font-size:11px; padding:3px 10px; border-radius:999px; background:#0d1b39; color:#a7b6d8; }
  .nota-p { color:#7e93c5; font-size:11.5px; margin:8px 0 0; overflow-wrap:anywhere; }
  .aviso-of { margin:10px 0 0; padding:9px 11px; border-radius:10px; background:#2a2110; border:1px solid #4a3a14; color:#ffd88a; font-size:12px; overflow-wrap:anywhere; }
  .aviso-of ul { margin:4px 0 0; padding-left:18px; } .aviso-of b { color:#ffc857; }
  .aviso-mal { background:#2a1420; border-color:#5a2536; color:#ffc9d8; } .aviso-mal b { color:#ff8fb0; }
  .aviso-bien { background:#0d2a22; border-color:#14503f; color:#8ff0cd; } .aviso-bien b { color:#38e0a5; }
  .acciones { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
  .acciones .btn { flex:1 1 170px; }
  details.mas { margin:10px 0 0; border-top:1px solid #0d1b39; padding-top:6px; }
  details.mas summary { cursor:pointer; min-height:40px; display:flex; align-items:center; color:#8fb0ff; font-size:12px; font-weight:650; list-style:none; }
  details.mas summary::-webkit-details-marker { display:none; } details.mas summary::before { content:'▸'; margin-right:7px; } details.mas[open] summary::before { content:'▾'; }

  /* Ebooks */
  .eb-lista { display:flex; flex-direction:column; gap:7px; margin:10px 0 0; }
  .eb-fila { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 11px; border-radius:11px; background:#040b1b; border:1px solid #112247; min-width:0; }
  .eb-fila.fuera { opacity:.5; }
  .eb-fila input[type="checkbox"] { width:22px; height:22px; margin:0; accent-color:#2f6bff; }
  .eb-fila .t { min-width:0; } .eb-fila .t b { display:block; font-size:12.8px; overflow-wrap:anywhere; } .eb-fila .t small { display:block; color:#7e93c5; font-size:11.5px; overflow-wrap:anywhere; }
  .eb-fila .pg { font-size:11.5px; color:#90a2cd; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .eb-fila .t small a { display:inline-flex; align-items:center; min-height:40px; padding:0 10px 0 6px; }   /* el enlace «Abrir» de cada ebook: area de toque de 40 px */
  .eb-fila .rol { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#8fb0ff; }
  .costo { margin:12px 0 0; padding:11px 13px; border-radius:11px; background:#040b1b; border:1px solid #112247; }
  .costo .g { font-size:24px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums; } .costo small { display:block; color:#7e93c5; font-size:11.5px; }
  .progreso { height:7px; border-radius:99px; background:#0d1b39; overflow:hidden; margin:10px 0 4px; box-shadow:inset 0 0 0 1px #12254e; }
  .progreso i { display:block; height:100%; width:0; background:linear-gradient(90deg,#2f6bff,#6aa0ff); transition:width .4s ease; }
  .girando::before { content:''; display:inline-block; width:13px; height:13px; margin-right:8px; border-radius:50%; border:2px solid #2f6bff; border-top-color:transparent; vertical-align:-2px; animation:gira .8s linear infinite; }
  @keyframes gira { to { transform:rotate(360deg); } }
  .archivos { display:flex; flex-direction:column; gap:6px; margin:10px 0 0; }
  .archivos a { display:flex; align-items:center; min-height:40px; color:#8fb0ff; overflow-wrap:anywhere; font-size:12.5px; }

  /* Pedidos de anuncio */
  .anuncios { display:flex; flex-direction:column; gap:10px; margin:10px 0 0; }
  .ad { background:#040b1b; border:1px solid #112247; border-radius:12px; padding:11px 12px; min-width:0; }
  .ad-top { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; }
  .ad-top b { font-size:14px; } .ad-top .sp { flex:1; }
  .est { font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; background:#0d1b39; color:#a7b6d8; white-space:nowrap; }
  .est.pedido { background:#0e2250; color:#8fb0ff; } .est.tomado, .est.en-edicion { background:#241a4d; color:#c9b8ff; } .est.lista { background:#2a2110; color:#ffc857; }
  .est.aprobada { background:#0d2a22; color:#38e0a5; } .est.error { background:#2a1420; color:#ff8fb0; } .est.cancelado { background:#16213f; color:#7e93c5; }
  .ad .grid2 { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:8px; margin:9px 0 0; }
  .ad .botones { display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 0; }
  .ad .botones .btn { min-height:40px; padding:0 11px; font-size:12px; flex:1 1 130px; }
  .ad .entrega { margin:9px 0 0; padding:8px 10px; border-radius:9px; background:#0d2a22; border:1px solid #14503f; color:#8ff0cd; font-size:12px; overflow-wrap:anywhere; }
  .ad .entrega a { color:#8ff0cd; }
  .ad .corr { margin:9px 0 0; font-size:11.5px; color:#ffc857; overflow-wrap:anywhere; }
  /* Progreso y vista previa de un anuncio (lo avisa el editor; aqui solo se pinta) */
  .ad .prog { margin:10px 0 0; padding:10px 11px; border-radius:11px; background:#071228; border:1px solid #16306b; min-width:0; }
  .ad .prog-cab { display:flex; flex-wrap:wrap; align-items:baseline; gap:3px 10px; font-size:12.5px; }
  .ad .prog-cab b { font-size:13px; } .ad .prog-cab small { color:#7e93c5; font-size:11px; }
  .ad .etapas { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; padding:0; list-style:none; }
  .ad .etapas li { font-size:11px; padding:4px 10px; border-radius:999px; background:#0d1b39; color:#7e93c5; white-space:nowrap; }
  .ad .etapas li.hecha { background:#0d2a22; color:#8ff0cd; }
  .ad .etapas li.activa { background:#1a3a8f; color:#e6efff; box-shadow:0 0 10px rgba(47,107,255,.45); }
  .ad .barra { height:7px; border-radius:999px; background:#0d1b39; overflow:hidden; margin:9px 0 0; }
  .ad .barra > i { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#2f6bff,#34d399); }
  .ad .prog-nota { margin:8px 0 0; font-size:12px; color:#bbc7e1; overflow-wrap:anywhere; }
  .ad .vistas { display:flex; flex-wrap:wrap; gap:12px; margin:10px 0 0; align-items:flex-start; }
  .ad .vista { min-width:0; } .ad .vista-img { flex:1 1 260px; } .ad .vista-vid { flex:0 1 240px; }
  .ad .vista img, .ad .vista video { display:block; width:100%; height:auto; border-radius:9px; border:1px solid #112247; background:#000; }
  .ad .vista video { max-width:260px; aspect-ratio:9/16; object-fit:contain; margin:0 auto; }
  .ad .vista small { display:block; margin:5px 0 0; color:#7e93c5; font-size:11px; }
  .ad .guion-txt { margin:8px 0 0; font-size:12.5px; color:#d6def0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .ad .plan-wrap { margin:8px 0 0; overflow-x:auto; min-width:0; }
  .ad table.plan { border-collapse:collapse; width:100%; min-width:440px; font-size:11.5px; }
  .ad table.plan th, .ad table.plan td { text-align:left; padding:5px 8px; border-bottom:1px solid #112247; vertical-align:top; overflow-wrap:anywhere; }
  .ad table.plan th { color:#7e93c5; font-weight:600; }
  .ad table.plan th:first-child, .ad table.plan td:first-child { white-space:nowrap; }
  .pedircambios { margin:9px 0 0; }
  .hist { margin:8px 0 0; padding:0; list-style:none; font-size:11.5px; color:#90a2cd; }
  .hist li { padding:3px 0; border-bottom:1px solid #0d1b39; overflow-wrap:anywhere; } .hist time { color:#7e93c5; margin-right:6px; }

  /* Crear toda la oferta: una tarjeta arriba de la ficha que resume lo que falta y lo encadena con un solo boton */
  .todo { margin:0 0 18px; padding:13px 14px 14px; border-radius:13px; background:linear-gradient(145deg,#0b1d45,#071228); border:1px solid #1d3a82; box-shadow:0 0 22px rgba(47,107,255,.22); min-width:0; }
  .todo h3 { font-size:14.5px; font-weight:800; margin:0 0 2px; }
  .todo .sub2 { color:#90a2cd; font-size:12px; margin:0 0 8px; }
  .todo-fila { display:grid; grid-template-columns:24px minmax(0,1fr); gap:8px; align-items:start; padding:7px 0; border-top:1px solid #12285a; font-size:12.5px; min-width:0; }
  .todo-fila .ic { font-size:14px; line-height:20px; text-align:center; color:#8fa3d6; }
  .todo-fila.hecho .ic { color:#38e0a5; } .todo-fila.error .ic { color:#ff8fb0; } .todo-fila.curso .ic { color:#8fb0ff; }
  .todo-fila b { display:block; font-size:12.8px; overflow-wrap:anywhere; } .todo-fila small { display:block; color:#90a2cd; font-size:11.5px; overflow-wrap:anywhere; }
  .todo .btn.grande { width:100%; min-height:46px; font-size:14px; margin-top:10px; }
  .pasos-modal { margin:12px 0 0; padding-left:20px; font-size:12.5px; color:#d3daeb; }
  .pasos-modal li { margin:0 0 8px; overflow-wrap:anywhere; } .pasos-modal small { display:block; color:#7e93c5; font-size:11.5px; }

  /* Guia de lanzamiento: lo que va despues de crear la oferta (revisar, cobrar, probar, Facebook, vigilar), por pais */
  .lz-paises { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 2px; }
  .lz-pais { min-height:40px; padding:0 13px; border-radius:999px; border:1px solid #1d3a82; background:#0a1838; color:#bbc7e1; font:inherit; font-size:12.5px; cursor:pointer; }
  .lz-pais.on { background:#1b3f95; color:#fff; border-color:transparent; }
  .lz-paso { margin:10px 0 0; border:1px solid #12285a; border-radius:11px; background:#061026; min-width:0; }
  .lz-paso > summary { cursor:pointer; min-height:48px; display:flex; align-items:center; gap:10px; padding:6px 12px; list-style:none; }
  .lz-paso > summary::-webkit-details-marker { display:none; }
  .lz-n { flex:0 0 28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:12.5px; font-weight:800; background:#12285a; color:#bcd0ff; }
  .lz-paso.hecho .lz-n { background:#0d2a22; color:#38e0a5; }
  .lz-paso.error .lz-n { background:#3a1424; color:#ff8fb0; }
  .lz-t { flex:1 1 auto; min-width:0; } .lz-t b { display:block; font-size:13px; overflow-wrap:anywhere; } .lz-t small { display:block; color:#90a2cd; font-size:11.5px; overflow-wrap:anywhere; }
  .lz-c { flex:0 0 auto; font-size:11.5px; color:#90a2cd; white-space:nowrap; }
  .lz-tareas { padding:0 12px 10px; min-width:0; }
  .lz-tarea { display:grid; grid-template-columns:42px minmax(0,1fr); gap:9px; align-items:start; padding:9px 0; border-top:1px solid #0f2149; min-width:0; }
  .lz-chk { box-sizing:border-box; width:42px; height:42px; border-radius:10px; border:1.5px solid #2a4a9a; background:#0a1838; color:#38e0a5; font-size:19px; font-weight:800; cursor:pointer; display:grid; place-items:center; padding:0; }
  .lz-chk.on { background:#0d2a22; border-color:#1f7a5c; }
  .lz-chk.auto { cursor:default; border-style:dashed; color:#8fa3d6; } .lz-chk.auto.on { color:#38e0a5; } .lz-chk.error { color:#ff8fb0; border-color:#7a2a44; background:#1f0d16; }
  .lz-chk:disabled { opacity:.55; }
  .lz-tarea b { display:block; font-size:12.8px; overflow-wrap:anywhere; } .lz-tarea small { display:block; color:#90a2cd; font-size:11.5px; overflow-wrap:anywhere; margin-top:2px; }
  .lz-tarea small b { display:inline; font-size:inherit; color:#d6def0; }
  .lz-quien { color:#8fb0ff; font-size:11px; font-weight:650; }
  .lz-por { color:#6f86bd; font-size:11px; }
  .lz-extra { margin-top:7px; min-width:0; }
  .lz-extra select { box-sizing:border-box; width:100%; max-width:100%; min-height:42px; }
  .lz-extra .acciones { margin-top:7px; }
  .lz-nombres { display:block; margin:6px 0 0; padding:8px 10px; border-radius:9px; background:#030a1c; border:1px solid #16306b; font-family:ui-monospace,Consolas,monospace; font-size:12px; color:#e6efff; white-space:pre-wrap; overflow-wrap:anywhere; }
  .lz-clave { display:inline-block; padding:1px 8px; border-radius:6px; background:#030a1c; border:1px solid #16306b; font-family:ui-monospace,Consolas,monospace; color:#e6efff; }

  /* Receta de edicion */
  .receta-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; }
  .receta-bar select { flex:1 1 220px; width:auto; }
  .receta-bar .btn { flex:0 1 auto; }
  .grupo { border:1px solid #112247; border-radius:12px; margin:0 0 10px; background:#061026; overflow:hidden; }
  .grupo > summary { cursor:pointer; min-height:44px; display:flex; align-items:center; gap:8px; padding:0 14px; font-weight:750; font-size:13px; list-style:none; }
  .grupo > summary::-webkit-details-marker { display:none; } .grupo > summary::before { content:'▸'; color:#8fb0ff; } .grupo[open] > summary::before { content:'▾'; }

<script>
(function () {
  'use strict';

  var S = {
    rol: '', proyectos: [], recetas: { base: {}, presets: {}, presetsBase: {} }, esquema: [], defecto: {}, tocadoPor: '',
    sel: null, det: null, tab: 'proyectos', tarjetas: null, radar: null, paises: [], modelos: null,
    prod: {},            // por proyecto: lo que pasa en el paso de ebooks (preparar, producir, material)
    flujo: {},           // por proyecto: lo que pasa al crear los flujos
    recetaForm: null
  };

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
  function copia(o) { return JSON.parse(JSON.stringify(o)); }
  function money(v) { return '$' + (v < 1 ? v.toFixed(3) : v.toFixed(2)); }
  function esDueno() { return S.rol === 'owner'; }
  // Solo http(s) llega a un href: los enlaces vienen de anuncios y paginas de terceros.
  function href(u) { return /^https?:\/\/[^\s"'<>]+$/i.test(String(u || '')) ? u : ''; }
  function hace(iso) {
    var t = Date.parse(iso); if (!t) return '';
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'ahora'; if (m < 60) return 'hace ' + m + ' min'; if (m < 1440) return 'hace ' + Math.round(m / 60) + ' h';
    return 'hace ' + Math.round(m / 1440) + ' d';
  }
  var ROLES = { owner: 'el dueño', trafficker: 'la trafficker', editor: 'el editor', videos: 'el editor de video', Claudia: 'Claudia' };
  function quien(r) { return ROLES[r] || r || 'alguien'; }

  function avisar(t, tipo) { var a = el('aviso'); a.className = 'aviso ' + (tipo || 'mal'); a.textContent = t || ''; if (t && tipo === 'bien') setTimeout(function () { if (a.textContent === t) { a.textContent = ''; a.className = 'aviso'; } }, 6000); }
  function toast(t, tipo) {
    var d = document.createElement('div'); d.className = 'toast' + (tipo === 'mal' ? ' mal' : ''); d.textContent = t;
    el('toast-root').appendChild(d); setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 4200);
  }

  // ---------- red ----------
  function api(cuerpo) {
    return fetch('/api/fabrica', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) })
      .then(function (r) {
        if (r.status === 401) throw new Error('Tu sesión caducó o no es del equipo: entra de nuevo.');
        return r.json().catch(function () { return null; }).then(function (j) {
          if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ('El servidor respondió ' + r.status + '.'));
          return j;
        });
      });
  }
  function pedir(url) {
    return fetch(url, { credentials: 'same-origin', cache: 'no-store' }).then(function (r) {
      if (r.status === 401) throw new Error('Tu sesión caducó o no es del equipo: entra de nuevo.');
      return r.json().catch(function () { return null; }).then(function (j) { if (!r.ok || !j || j.ok === false) { var er = new Error((j && j.error) || ('El servidor respondió ' + r.status + '.')); er.status = r.status; throw er; } return j; });
    });
  }
  // La puerta a la red del motor: JSON o binario, con el mismo contrato en todas las herramientas del equipo.
  function http(ruta, init) {
    init = init || {};
    var o = { method: init.metodo || 'GET', credentials: 'same-origin', cache: 'no-store', headers: {} };
    if (init.json !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(init.json); }
    else if (init.binario) { o.body = init.binario instanceof Blob ? init.binario : new Blob([init.binario]); }
    return fetch(ruta, o).then(function (r) {
      var tipo = r.headers.get('Content-Type') || '';
      if (/json/i.test(tipo) || r.status >= 400) return r.text().then(function (t) { var j = null; try { j = JSON.parse(t); } catch (e) { /* no era JSON */ } return { status: r.status, tipo: tipo, json: j }; });
      return r.blob().then(function (b) { return { status: r.status, tipo: tipo, blob: b }; });
    });
  }

  // ---------- carga ----------
  // La lista sale de un `list` de KV, que puede ir varios minutos atrasado: justo despues de quitar una oferta seguia saliendo (y al abrirla decia «Ese proyecto no
  // existe»). Lo que se quito desde este navegador se esconde hasta que la lista se pone al dia o pasan 15 min. Solo es la vista: el borrado ya lo hizo el servidor.
  var CLAVE_QUITADAS = 'fabrica:quitadas', VIDA_QUITADA = 15 * 60000;
  function leerQuitadas() {
    var q = {}; try { q = JSON.parse(localStorage.getItem(CLAVE_QUITADAS) || '{}') || {}; } catch (e) { q = {}; }
    var ahora = Date.now(), out = {};
    Object.keys(q).forEach(function (id) { if (typeof q[id] === 'number' && ahora - q[id] < VIDA_QUITADA) out[id] = q[id]; });
    return out;
  }
  function guardarQuitadas(q) { try { if (Object.keys(q).length) localStorage.setItem(CLAVE_QUITADAS, JSON.stringify(q)); else localStorage.removeItem(CLAVE_QUITADAS); } catch (e) { /* sin almacenamiento: solo dura esta pestaña */ } }
  var quitadasPestana = {};
  function marcarQuitada(id) {
    var q = leerQuitadas(); q[id] = Date.now(); quitadasPestana[id] = q[id]; guardarQuitadas(q);
    S.proyectos = S.proyectos.filter(function (p) { return p.id !== id; });
  }
  function sinQuitadas(lista) {
    var q = Object.assign(leerQuitadas(), quitadasPestana), ahora = Date.now(), siguen = {};
    var out = lista.filter(function (p) { if (q[p.id] && ahora - q[p.id] < VIDA_QUITADA) { siguen[p.id] = q[p.id]; return false; } return true; });
    quitadasPestana = siguen; guardarQuitadas(siguen);      // la que ya no viene en la lista se olvida: la lista se puso al dia
    return out;
  }
  function cargarLista() {
    return pedir('/api/fabrica').then(function (j) {
      S.rol = j.rol; S.proyectos = sinQuitadas(j.proyectos || []); S.recetas = j.recetas; S.esquema = j.esquema; S.defecto = j.defecto;
      pintarLista();
      if (S.tab === 'recetas') pintarRecetas();
    }).catch(function (e) {
      el('lista').innerHTML = '<div class="vacio">' + esc(e.message) + '</div>';
    });
  }
  function cargarPaises() {
    return pedir('/api/zapflow?catalogo=1').then(function (j) { S.paises = j.paises || []; }).catch(function () { S.paises = []; });
  }
  function cargarModelos() {
    if (S.modelos && !S.modelos.falta) return Promise.resolve(S.modelos);
    return FabricaMotor.cargarModelos(FabricaMotor.crearCliente({ http: http })).then(function (m) { S.modelos = m; return m; });
  }

  // ---------- lista ----------
  var ETQ_ETAPA = { pendiente: 'sin empezar', 'en-curso': 'en curso', lista: 'lista', error: 'con error' };
  function lineaChip(nombre, estado, extra) {
    return '<span class="lin ' + esc(estado) + '">' + esc(nombre) + ': ' + esc(extra || ETQ_ETAPA[estado] || estado) + '</span>';
  }
  function chipsDe(p) {
    var a = p.a || {}, e = p.e || {};
    var anuncios = a.total ? (a.aprobados + a.listos) + ' de ' + a.total + ' listos' + (p.ar && a.pedidos ? ' · en cola' : '') : 'sin pedir';
    var estA = !a.total ? 'pendiente' : (a.errores ? 'error' : (a.aprobados + a.listos === a.total ? 'lista' : (a.trabajando || a.listos || a.aprobados ? 'en-curso' : 'pendiente')));
    var lz = Array.isArray(p.l) && p.l[0] > 0 ? lineaChip('Lanzamiento', p.l[0] >= p.l[1] ? 'lista' : 'en-curso', p.l[0] >= p.l[1] ? 'hecho' : p.l[0] + ' de ' + p.l[1] + ' tareas') : (e.flujos === 'lista' ? lineaChip('Lanzamiento', 'pendiente', 'sin empezar') : '');
    return lineaChip('Ebooks', e.ebooks || 'pendiente') + lineaChip('Anuncios', estA, anuncios) + lineaChip('Flujos', e.flujos || 'pendiente', (e.flujos === 'lista') ? 'creados' : null) + lz;
  }
  function pintarLista() {
    var l = S.proyectos;
    el('lista').innerHTML = l.length ? l.map(function (p) {
      return '<div class="proy' + (S.sel === p.id ? ' sel' : '') + '" role="button" tabindex="0" data-id="' + esc(p.id) + '">' +
        '<div><b class="nom">' + esc(p.n) + '</b><small>' + esc((p.p || []).join(', ')) + ' · ' + esc(hace(p.t)) + (p.r ? ' · viene del radar' : '') + '</small></div>' +
        '<div class="lineas">' + chipsDe(p) + '</div></div>';
    }).join('') : '<div class="vacio">Todavía no hay ofertas en la fábrica.<br>Pulsa «Fabricar una oferta» y elige una del tablero.</div>';
  }

  // ---------- abrir / cerrar la ficha ----------
  function abrirProyecto(id, sinSalto) {
    S.sel = id; el('cuerpo').classList.add('con-ficha'); el('ficha').hidden = false; document.documentElement.classList.add('ficha-abierta');
    try { history.replaceState(null, '', '#p=' + encodeURIComponent(id)); } catch (e) { /* sin historial */ }
    pintarLista();
    if (!S.det || S.det.proyecto.id !== id) { el('ficha').innerHTML = '<div class="f-cuerpo"><p class="girando">Abriendo…</p></div>'; }
    return refrescarDetalle().then(function () { if (!sinSalto && window.innerWidth > 1180) { var r = el('ficha').getBoundingClientRect(); if (r.top > 18 || r.bottom > window.innerHeight) window.scrollTo({ top: Math.max(0, window.pageYOffset + r.top - 14), behavior: 'smooth' }); } });
  }
  function cerrarFicha() {
    S.sel = null; S.det = null; el('cuerpo').classList.remove('con-ficha'); el('ficha').hidden = true; document.documentElement.classList.remove('ficha-abierta');
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* sin historial */ }
    pintarLista();
  }
  function refrescarDetalle(soloAnuncios) {
    var id = S.sel; if (!id) return Promise.resolve();
    var salio = Date.now();
    return pedir('/api/fabrica?id=' + encodeURIComponent(id)).then(function (j) {
      if (S.sel !== id) return;
      // salio antes de que terminara un guardado de la guia de lanzamiento (o mientras se guarda): se queda el proyecto que devolvio el guardado
      if (S.det && S.det.proyecto && S.det.proyecto.id === id && (LZ.guardando || salio < LZ.guardadoEn)) j.proyecto = S.det.proyecto;
      var primera = !S.det || S.det.proyecto.id !== id;
      S.det = j; S.rol = j.rol || S.rol;
      var m = S.proyectos.filter(function (p) { return p.id === id; })[0];
      if (primera || !soloAnuncios) { pintarFicha(); return cargarPedidoEbooks(); }
      pintarAnuncios();
    }).catch(function (e) {
      if (S.sel !== id) return;
      // Ya no existe (alguien la quito y la lista aun no se entera): se saca de lo que se ve, sin recordarla, por si una lectura atrasada la diera por perdida.
      var ida = e.status === 404 && S.proyectos.some(function (p) { return p.id === id; });
      if (ida) { S.proyectos = S.proyectos.filter(function (p) { return p.id !== id; }); pintarLista(); }
      var msj = ida ? 'Esta oferta ya se quitó de la fábrica. La lista tarda unos minutos en ponerse al día.' : e.message;
      el('ficha').innerHTML = '<div class="f-cab"><div class="t"><b>No se pudo abrir</b></div><button class="btn cerrar" data-acc="cerrar" aria-label="Cerrar">✕</button></div><div class="f-cuerpo"><div class="aviso-of aviso-mal">' + esc(msj) + '</div></div>';
    });
  }

  // ---------- la ficha ----------
  function pasoHtml(n, titulo, sub, hecho, id, cuerpo) {
    return '<div class="paso' + (hecho ? ' hecho' : '') + '" id="' + id + '"><span class="n">' + (hecho ? '✓' : n) + '</span><h3>' + esc(titulo) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</h3><div class="cuerpo-paso">' + cuerpo + '</div></div>';
  }
  function pintarFicha() {
    var d = S.det; if (!d) return;
    var p = d.proyecto;
    var f = el('ficha'), arriba = f.scrollTop;
    f.innerHTML = '<div class="f-cab"><div class="t"><b>' + esc(p.nombre) + '</b><small>' + esc((p.paises || []).join(', ')) + ' · producto «' + esc(p.slug) + '» en el editor</small></div>' +
      '<button class="btn cerrar" data-acc="cerrar" aria-label="Cerrar">✕</button></div>' +
      '<div class="f-cuerpo">' +
        '<div class="todo" id="sec-todo"></div>' +
        '<div class="todo" id="sec-lanzar"></div>' +
        pasoHtml(1, 'La oferta', 'de dónde sale y para qué países', true, 'sec-oferta', ofertaHtml(p)) +
        pasoHtml(2, 'Ebooks y bonos', 'el entregable de la oferta', p.etapas.ebooks.estado === 'lista' && p.etapas.material.estado === 'lista', 'sec-ebooks', '') +
        pasoHtml(3, 'Anuncios para Claudia', 'modelados, en español y con subtítulos', false, 'sec-anuncios', '') +
        pasoHtml(4, 'Flujos en ZapData', 'venta, entrega y pagos', p.etapas.flujos.estado === 'lista', 'sec-flujos', '') +
        pasoHtml(5, 'Receta de edición', 'cómo se editan los anuncios de esta oferta', false, 'sec-receta', recetaResumenHtml()) +
        '<div class="paso" id="sec-hist"><span class="n">↻</span><h3>Qué ha pasado</h3><div class="cuerpo-paso">' + histHtml(p.hechos) + '</div></div>' +
      '</div>';
    f.scrollTop = arriba;
    pintarTodo(); pintarEbooks(); pintarAnuncios(); pintarFlujos();
    document.documentElement.classList.toggle('ficha-abierta', window.innerWidth <= 1180);
  }
  function kv(k, v) { return v ? '<dt>' + esc(k) + '</dt><dd>' + v + '</dd>' : ''; }
  function ofertaHtml(p) {
    var o = p.origen || {}, enl = '';
    if (href(o.linkAnuncio)) enl += '<a class="btn" href="' + esc(o.linkAnuncio) + '" target="_blank" rel="noopener noreferrer">' + (/[?&]view_all_page_id=/.test(o.linkAnuncio) ? 'Ver los anuncios del anunciante ↗' : 'Ver el anuncio original ↗') + '</a>';
    if (href(o.linkPagina)) enl += '<a class="btn" href="' + esc(o.linkPagina) + '" target="_blank" rel="noopener noreferrer">Ver su página ↗</a>';
    if (o.radarId) enl += '<a class="btn" href="/radar#o=' + encodeURIComponent(o.radarId) + '">Abrir en el radar</a>';
    enl += '<a class="btn" href="/tablero">Ver el tablero</a>';

    if (acc === 'copiar-orden') { ordenDe(ad).then(copiar).then(function () { toast('Orden copiada: pégasela a Claudia'); }).catch(function (er) { toast(er.message, 'mal'); }); return; }
    if (acc === 'guardar-ref') {
      var u = document.querySelector('[data-ref="url"][data-ad="' + ad + '"]').value.trim(), nt = document.querySelector('[data-ref="nota"][data-ad="' + ad + '"]').value.trim();
      if (u && !/^https:\/\//i.test(u)) { toast('El enlace debe empezar con https://', 'mal'); return; }
      actualizarAnuncio(ad, { referencia: { videoUrl: u, nota: nt } }, 'Referencia guardada'); return;
    }
    if (acc === 'aprobar') { actualizarAnuncio(ad, { estado: 'aprobada' }, ad + ' aprobado'); return; }
    if (acc === 'pedir-cambios') { adCambiosAbierto = ad; pintarAnuncios(); var q = document.querySelector('[data-cambios="' + ad + '"]'); if (q) q.focus(); return; }
    if (acc === 'cerrar-cambios') { adCambiosAbierto = ''; pintarAnuncios(); return; }
    if (acc === 'enviar-cambios') { var tx = document.querySelector('[data-cambios="' + ad + '"]').value.trim(); if (!tx) { toast('Di qué hay que cambiar.', 'mal'); return; } adCambiosAbierto = ''; actualizarAnuncio(ad, { estado: 'pedido', texto: tx }, 'Cambios enviados: Claudia lo verá en su cola'); return; }
    if (acc === 'cancelar-ad') { if (confirm('¿Cancelar el pedido ' + ad + '?')) actualizarAnuncio(ad, { estado: 'cancelado' }, ad + ' cancelado'); return; }
    if (acc === 'reabrir-ad') { actualizarAnuncio(ad, { estado: 'pedido' }, ad + ' vuelve a la cola de Claudia'); return; }
    if (acc === 'ad-nuevo') { api({ accion: 'anuncio_nuevo', id: p.id }).then(function (j) { toast(j.anuncio.id + ' pedido'); return refrescarDetalle(true).then(cargarLista); }).catch(function (er) { toast(er.message, 'mal'); }); return; }
    if (acc === 'receta-oferta') {
      abrirRecetaModal('Receta de «' + p.nombre + '»', p.receta, d.recetaBase ? F_mezclar(d.recetaBase) : S.defecto, 'oferta', function (r) { return api({ accion: 'editar', id: p.id, receta: r }).then(function (j) { S.det.proyecto = j.proyecto; return refrescarDetalle().then(cargarLista); }); });
      return;
    }
    if (acc === 'receta-ad') {
      var a = d.anuncios.filter(function (x) { return x.id === ad; })[0];
      abrirRecetaModal('Receta de ' + ad + ' (' + p.nombre + ')', a.receta, d.recetaFinal, 'anuncio', function (r) { return api({ accion: 'anuncio', id: p.id, anuncio: ad, receta: r }).then(function () { return refrescarDetalle(true).then(cargarLista); }); });
      return;
    }
    if (acc === 'crear-flujos') { crearFlujos(); return; }
    if (acc === 'lz-pais') { LZ.pais[p.id] = b.dataset.pais; pintarLanzar(); return; }
    if (acc === 'lz-marcar') { if (LZ.guardando) return; guardarLanzamiento({ tarea: b.dataset.k, hecho: b.getAttribute('aria-pressed') !== 'true' }, b.dataset.k); return; }
    if (acc === 'lz-programar') { if (window.FabricaCampanas) window.FabricaCampanas.abrir({ id: p.id, pais: paisElegido(p), nombre: p.nombre, alTerminar: function () { refrescarDetalle(); } }); return; }
    if (acc === 'lz-copiar-nombres') { var mkN = marcasDe(p, paisElegido(p)); copiar(nombresDeCampana(p, mkN.num, d.anuncios).join(String.fromCharCode(10))).then(function () { toast('Nombres copiados: pégalos en Facebook, uno por campaña'); }).catch(function (er) { toast(er.message, 'mal'); }); return; }
    if (acc === 'copiar-claude') {
      var Fz = fl(p.id), fj = (Fz.resultado && Fz.resultado.estado === 'hecho') ? Fz.resultado : { id: p.material.flujo && p.material.flujo.pedidoId, flujos: p.material.flujo && p.material.flujo.flujos };
      // La orden lleva los enlaces y los ids de cada flujo: se piden al pedido guardado (si no se pueden leer, sale la orden con los nombres solos).
      var traerFlujos = fj && fj.id ? pedir('/api/zapflow?id=' + encodeURIComponent(fj.id)).then(function (jz) { return jz && jz.pedido ? { creados: jz.pedido.creados || [], pagos: jz.pedido.pagos || [], flujos: jz.pedido.flujos || (fj && fj.flujos) || [] } : {}; }).catch(function () { return {}; }) : Promise.resolve({});
      traerFlujos.then(function (extra) { return copiar(FabricaMotor.ordenParaClaude(p, Object.assign({}, fj, extra))); }).then(function () { toast('Orden copiada: pégasela a Claude'); }).catch(function (er) { toast(er.message, 'mal'); }); return;
    }
  });
  // La receta que se ve «por debajo» de una oferta: la de fabrica con la base del dueño encima.
  function F_mezclar(base) {
    var out = copia(S.defecto);
    S.esquema.forEach(function (g) { g.campos.forEach(function (c) { var v = valorDe(base, c.k); if (v !== undefined) ponerValor(out, c.k, copia({ v: v }).v); }); });
    return out;
  }
  document.addEventListener('toggle', function (e) {
    var t = e.target; if (!t || !t.classList || !t.classList.contains('lz-paso') || !S.det) return;
    var p = S.det.proyecto, clave = p.id + '|' + paisElegido(p), ab = LZ.abiertos[clave] || (LZ.abiertos[clave] = {});
    if (t.open) ab[t.getAttribute('data-n')] = 1; else delete ab[t.getAttribute('data-n')];
  }, true);
  document.addEventListener('change', function (e) {
    var t = e.target, d = S.det, p = d && d.proyecto;
    if (t.dataset && t.dataset.pais !== undefined && t.closest('#p-paises')) { t.closest('label').classList.toggle('on', t.checked); return; }
    if (t.dataset && t.dataset.npais !== undefined) { t.closest('label').classList.toggle('on', t.checked); return; }
    if (!p) return;
    if (t.dataset && t.dataset.lz === 'numero') {
      var o = t.options[t.selectedIndex];
      guardarLanzamiento({ numero: t.value ? { id: t.value, wpp: o.getAttribute('data-wpp') || '', nombre: o.getAttribute('data-nombre') || '', tel4: o.getAttribute('data-tel4') || '' } : null }, 'numero');
      return;
    }
    var P = prod(p.id);
    if (t.dataset && t.dataset.campo === 'pais') { P.pais = t.value; }
    else if (t.dataset && t.dataset.campo === 'leerPagina') { P.leerPagina = t.checked; }
    else if (t.dataset && t.dataset.eb !== undefined && P.prep) { P.prep.entregables[Number(t.dataset.eb)].incluir = t.checked; pintarEbooks(); }
  });
  document.addEventListener('input', function (e) { var t = e.target; if (t.dataset && t.dataset.campo === 'datosPago' && S.det) prod(S.det.proyecto.id).datosPago = t.value; });
  el('lista').addEventListener('keydown', function (e) { if (e.key !== 'Enter' && e.key !== ' ') return; var c = e.target.closest('.proy'); if (!c) return; e.preventDefault(); abrirProyecto(c.dataset.id); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (el('modal-root').firstChild) cancelarModal(); } });

  // ---------- mirar a Claudia: el detalle se refresca solo mientras esta abierto y visible ----------
  // Cada vuelta cuesta lecturas de KV (el detalle) y, si se recarga la lista, 3 LISTADOS: el plan gratuito da 1.000 listados al dia para TODA la suite (el ejecutor de reglas, el
  // libro de gasto y el tablero tambien los usan). Por eso:
  //  - el detalle (solo lecturas por clave) se mira cada 45 s mientras Claudia trabaja, cada 3 min si solo hay pedidos esperando, y no se mira si todo esta quieto;
  //  - la lista (los listados) se recarga como mucho cada 10 min y solo si algo cambio en el detalle;
  //  - tras 20 min sin tocar la pagina se deja de mirar hasta que la persona vuelve a usarla.
  var vistoEn = Date.now(), ultimaLista = Date.now(), ultimoDetalle = 0, huellaDet = '';
  ['click', 'keydown', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, function () { vistoEn = Date.now(); }, { passive: true }); });
  setInterval(function () {
    if (!S.sel || document.visibilityState !== 'visible' || !S.det || hayCorriendo() || LZ.guardando) return;
    if (el('sec-lanzar') && !el('sec-lanzar').hidden) cargarCanales();       // los numeros en vivo (con su propio freno de 2 min)
    if (Date.now() - vistoEn > 20 * 60000) return;
    if (el('sec-lanzar') && !el('sec-lanzar').hidden) cargarFlujos(S.det.proyecto);   // los flujos encendidos (con su propio freno de 2 min); no se le pregunta a ZapData si nadie usa la pagina
    var ads = S.det.anuncios || [];
    var trabajando = ads.some(function (a) { return a.estado === 'tomado' || a.estado === 'en-edicion'; });
    var esperando = ads.some(function (a) { return a.estado === 'pedido'; });
    var cada = trabajando ? 45000 : (esperando ? 180000 : 0);
    if (!cada || Date.now() - ultimoDetalle < cada - 1000) return;
    ultimoDetalle = Date.now();
    refrescarDetalle(true).then(function () {
      var h = JSON.stringify(((S.det && S.det.anuncios) || []).map(function (a) { return [a.id, a.estado, a.actualizadoEn]; }));
      if (h !== huellaDet && Date.now() - ultimaLista > 10 * 60000) { ultimaLista = Date.now(); cargarLista(); }
      huellaDet = h;
    });
  }, 15000);

  // ---------- La revision de los flujos de venta encendidos (2026-11-06) ----------
  // Pedido del dueño despues de que «Embarazo» de Colombia recibiera trafico con el flujo sin terminar: «que me de alguna alerta en el dash si eso esta mal». /api/zapdata-flujos?revision=1 dice que
  // Ventas ENCENDIDAS tienen el inicio sin arreglar o no tienen su rama en el flujo de Pagos del pais (functions/_zapdata-revision.js). El menu pone el aviso rojo en todas las paginas; aqui va el detalle:
  // que esta mal, que pasa por eso y que hacer. Se pide al abrir la pagina; cada 20 s mientras falten flujos por revisar (la primera vez son unos 30, uno por consulta) y cada 5 min despues (tambien
  // si ZapData no dejo leer alguno), solo con la pagina a la vista y en uso (el servidor guarda el resultado 30 min para todos: casi siempre contesta sin preguntarle a ZapData).
  // Con algo mal: la lista en rojo (las 3 primeras a la vista, el resto plegado) y role="alert" solo cuando la lista cambia (un lector de pantalla no la repite cada 5 min). Sin nada mal pero sin poder
  // confirmar todo (no esta el flujo de Pagos del pais, la Venta no pone la etiqueta, ZapData no dejo leer el flujo): una linea en amarillo, nunca el «✓».
  var REV = { x: null, en: 0, cargando: false, intentos: 0, huella: '', bajado: false };
  function cargarRevision() {
    if (REV.cargando) return;
    REV.cargando = true;
    fetch('/api/zapdata-flujos?revision=1', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (j) { REV.x = j && typeof j === 'object' ? j : { ok: false, mensaje: 'ZapData no contestó.' }; })
      .catch(function () { REV.x = { ok: false, motivo: 'red', mensaje: 'No pude preguntarle a ZapData en este momento.' }; })
      .then(function () {
        REV.cargando = false; REV.en = Date.now(); REV.intentos++;
        pintarRevision();
        try { if (typeof window.__avisoFlujos === 'function') window.__avisoFlujos(REV.x); } catch (e) { /* el aviso del menu es un accesorio */ }
      });
  }
  function ofertaDeLaFabrica(nombre) {
    var n = plano(nombre); if (!n) return null;
    return (S.proyectos || []).filter(function (p) { return plano(p.n) === n; })[0] || null;
  }
  function cuandoRevision(x) { return Date.parse(x.revisadoEn) ? ' Revisado ' + esc(hace(x.revisadoEn)) + '.' : ''; }
  var MOTIVO_DUDA = { 'sin-pagos': 'no encontré el flujo de Pagos de su país', 'no-aplica': 'la Venta no pone la etiqueta «Pago Pendiente…»', 'sin-inicio': 'ZapData no mostró su inicio' };
  function esObjeto(p) { return p && typeof p === 'object'; }
  function nombreRev(p) { return esc(p.oferta || 'Oferta sin nombre') + (p.pais ? ' · ' + esc(p.pais) : ''); }
  function problemaRev(p) {
    var nom = p.pagosNombre ? '«' + esc(p.pagosNombre) + '»' : 'el flujo de Pagos del país', males = [];
    if (p.inicio === 'mal') males.push('el inicio de la Venta no está arreglado: al escribir la palabra clave no sale ningún mensaje');
    if (p.pagos === 'falta') males.push(nom + ' no tiene su rama: quien paga no recibe la entrega');
    if (p.pagos === 'suelta') males.push(nom + ' tiene su rama, pero no está conectada: quien paga no recibe la entrega');
    if (p.pagos === 'otra') males.push('su rama en ' + nom + ' lleva a un flujo apagado: quien paga no recibe la entrega');
    if (p.pagos === 'casi') males.push('en ' + nom + ' su rama tiene la etiqueta escrita distinto que en la Venta (tildes, mayúsculas o espacios): ZapData puede no reconocerla');
    var of = ofertaDeLaFabrica(p.oferta), acc = [];
    if (ID_FLUJO.test(String(p.venta || ''))) acc.push('<a class="btn" href="https://zapdata.co/inbox/flows/' + esc(String(p.venta).toLowerCase()) + '" target="_blank" rel="noopener noreferrer">Abrir la Venta en ZapData</a>');
    if (of) acc.push('<button type="button" class="btn" data-acc="rev-abrir" data-id="' + esc(of.id) + '">Abrir la oferta aquí</button>');
    return '<li><b>' + nombreRev(p) + '</b>: ' + (males.join('; ') || 'algo no cuadra') + '.' + (acc.length ? '<div class="acciones">' + acc.join('') + '</div>' : '') + '</li>';
  }
  function pintarRevision() {
    var c = el('revision'), x = REV.x; if (!c) return;
    if (!x) { c.hidden = true; c.innerHTML = ''; return; }
    var h = '', ok = x.ok === true;
    var l = ok && Array.isArray(x.problemas) ? x.problemas.filter(esObjeto) : [], du = ok && Array.isArray(x.dudas) ? x.dudas.filter(esObjeto) : [];
    var tot = Number(x.total) || 0, rev = Number(x.revisadas) || 0, nl = Number(x.noLeidas) || 0;
    var viejo = ok && x.aviso ? ' ' + esc(x.aviso) + ' Esto es lo último que se supo.' : '';
    var mas = [];
    if (ok && !x.completo) mas.push('Revisando en ZapData el inicio y la rama de pagos de las ventas encendidas: van ' + rev + ' de ' + tot + '.' + (x.limite ? ' ZapData llegó a su tope de consultas de hoy: sigo más tarde.' : ''));
    if (nl) mas.push((nl === 1 ? 'De una venta encendida' : 'De ' + nl + ' ventas encendidas') + ' ZapData no dejó leer el flujo: lo intento de nuevo más tarde.');
    if (du.length) mas.push('No pude confirmar todo de ' + (du.length === 1 ? 'una venta' : du.length + ' ventas') + ': ' + du.slice(0, 5).map(function (p) { return nombreRev(p) + ' (' + (MOTIVO_DUDA[p.motivo] || 'sin confirmar') + ')'; }).join('; ') + (du.length > 5 ? '; y ' + (du.length - 5) + ' más' : '') + '.');
    if (l.length) {
      var huella = JSON.stringify(l.map(function (p) { return [p.venta, p.inicio, p.pagos]; })), nueva = huella !== REV.huella, li = l.map(problemaRev);
      REV.huella = huella;
      h = '<div class="aviso-of aviso-mal"' + (nueva ? ' role="alert"' : '') + '><b>⚠ ' + (l.length === 1 ? 'Una oferta tiene el flujo de venta encendido sin terminar' : l.length + ' ofertas tienen el flujo de venta encendido sin terminar') + '</b>' +
        '<ul>' + li.slice(0, 3).join('') + '</ul>' + (li.length > 3 ? '<details><summary>Ver ' + (li.length - 3 === 1 ? 'una más' : 'las otras ' + (li.length - 3)) + '</summary><ul>' + li.slice(3).join('') + '</ul></details>' : '') +
        '<small>Qué hacer: en la guía de esa oferta (paso 2) usa «Copiar la orden para Claude» y pégasela a Claude con ZapData abierto. Si ya tiene anuncios encendidos, páusalos hasta que quede arreglada.' + cuandoRevision(x) + viejo + '</small>' +
        (mas.length ? '<small>' + mas.join(' ') + '</small>' : '') + '</div>';
    } else if (ok) {
      REV.huella = '';
      if (x.completo && !du.length && !nl) h = '<p class="rev-linea bien">✓ ' + (tot === 1 ? 'La venta encendida tiene' : 'Las ' + tot + ' ventas encendidas tienen') + ' el inicio y la rama de pagos bien, según ZapData.' + cuandoRevision(x) + viejo + '</p>';
      else if (x.completo) { var bien = Math.max(0, rev - du.length); h = '<p class="rev-linea ojo">' + (bien === 1 ? 'Una venta encendida tiene' : bien + ' de ' + tot + ' ventas encendidas tienen') + ' el inicio y la rama de pagos bien, según ZapData. ' + mas.join(' ') + cuandoRevision(x) + viejo + '</p>'; }
      else h = '<p class="rev-linea">' + mas.join(' ') + viejo + '</p>';
    } else {
      h = '<p class="rev-linea">No pude revisar los flujos de venta en ZapData: ' + esc(x.mensaje || 'no contestó') + '</p>';
    }
    var plegado = c.querySelector('details'), abierto = !!(plegado && plegado.open);   // si la persona abrio «Ver las otras…», sigue abierto al repintar
    c.innerHTML = h; c.hidden = false;
    if (abierto && c.querySelector('details')) c.querySelector('details').open = true;
    // quien llega desde el aviso del menu (/fabrica#revision) ve la caja de una vez
    if (!REV.bajado && location.hash === '#revision') { REV.bajado = true; try { c.scrollIntoView({ block: 'start' }); } catch (e) { /* navegador viejo */ } }
  }
  setInterval(function () {
    if (document.visibilityState !== 'visible' || Date.now() - vistoEn > 20 * 60000 || REV.cargando) return;
    var x = REV.x, falta = x && x.ok === true && !x.completo && !x.limite && !x.revisionFallo && REV.intentos < 80;
    if (!x || (falta && Date.now() - REV.en > 19000) || Date.now() - REV.en > 5 * 60000) cargarRevision();
  }, 20000);

  // ---------- arranque ----------
  function desdeLaDireccion() {
    var h = location.hash, m;
    if ((m = h.match(/^#p=([\w-]+)$/))) { abrirProyecto(m[1], true); return; }
    if ((m = h.match(/^#nueva=([\w-]+)$/))) {
      var tid = m[1];
      cargarTarjetas().then(function () {
        var t = S.tarjetas.filter(function (x) { return x.id === tid; })[0];
        var id = t ? idDeProyecto(t) : tid;
        if (S.proyectos.filter(function (p) { return p.id === id; })[0]) { abrirProyecto(id, true); return; }
        try { history.replaceState(null, '', location.pathname); } catch (er) {}
        abrirNueva(tid);
      }).catch(function () { abrirNueva(); });
    }
  }
  cargarLista().then(function () { cargarRevision(); return cargarPaises(); }).then(function () { cargarModelos().catch(function () {}); desdeLaDireccion(); });
})();
</script>
